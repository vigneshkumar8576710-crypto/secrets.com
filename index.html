<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Anton&display=swap" rel="stylesheet">

  <!-- All styling is right here inside index.html -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #141210;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Anton', sans-serif;
    }

    .viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .stage {
      position: relative;
      width: min(96vw, calc(96vh * (16 / 9)));
      aspect-ratio: 16 / 9;
      background-color: #f6efe6;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    .bg-wrapper {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
    }

    .bg-image {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 56.25%;
      height: 177.78%;
      object-fit: cover;
      transform: translate(-50%, -50%) rotate(-90deg);
      pointer-events: none;
    }

    .layer {
      position: absolute;
      user-select: none;
    }

    .portrait-fade {
      z-index: 2;
      bottom: 0;
      left: 42%;
      height: 82%;
      width: auto;
      object-fit: contain;
      filter: grayscale(100%) contrast(95%);
      opacity: 0.35;
    }

    .birthday-text {
      z-index: 3;
      top: 34%;
      left: 7.5%;
      display: flex;
      gap: 0.4vw;
      font-size: clamp(3rem, 13.8vw, 13.8rem);
      line-height: 0.85;
      color: #ffffff;
      letter-spacing: 0.02em;
      transform: rotate(-11deg);
      text-shadow: 0 6px 20px rgba(82, 65, 48, 0.14);
    }

    .birthday-text span {
      display: inline-block;
    }

    .portrait-color {
      z-index: 4;
      bottom: 0;
      left: 26%;
      height: 80%;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(4px 8px 16px rgba(0, 0, 0, 0.22));
    }

    .happy-text {
      z-index: 5;
      top: 21%;
      left: 4.5%;
      font-family: 'Alex Brush', cursive;
      font-size: clamp(2.2rem, 7.6vw, 7.6rem);
      color: #d31924;
      transform: rotate(-8deg);
      text-shadow: 1px 2px 6px rgba(255, 255, 255, 0.6);
    }

    .bow-icon {
      z-index: 6;
      top: 40.5%;
      left: 5.2%;
      width: 8.5%;
      transform: rotate(-14deg);
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.15));
    }

    .hearts-group {
      z-index: 6;
      top: 6%;
      right: 9.5%;
      width: 7%;
      height: 18%;
    }

    .heart {
      position: absolute;
      width: 44%;
      filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.15));
    }

    .h1 { top: 0; right: 5%; transform: rotate(12deg); }
    .h2 { top: 34%; left: 0; width: 38%; transform: rotate(-16deg); }
    .h3 { bottom: 0; right: 12%; width: 42%; transform: rotate(8deg); }

    .butterfly-wrapper {
      z-index: 6;
      bottom: 24%;
      right: 8.5%;
      width: 8.5%;
      transform: rotate(-22deg);
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.2));
    }

    .butterfly-svg {
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .replay-btn {
      position: absolute;
      bottom: 14px;
      right: 14px;
      z-index: 20;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(120, 95, 70, 0.25);
      color: #4a3b2c;
      padding: 6px 12px;
      border-radius: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .replay-btn:hover {
      opacity: 1;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <main class="viewport">
    <div class="stage" id="stage">

      <!-- Background -->
      <div class="bg-wrapper">
        <img src="assets/bg.jpg" alt="Scrapbook Background" class="bg-image" />
      </div>

      <!-- Faded Background Portrait -->
      <img src="assets/girl-fade.png" alt="Background Portrait" class="layer portrait-fade" />

      <!-- Tilted "BIRTHDAY" Text -->
      <div class="layer birthday-text" aria-label="BIRTHDAY">
        <span>B</span><span>I</span><span>R</span><span>T</span><span>H</span><span>D</span><span>A</span><span>Y</span>
      </div>

      <!-- Foreground Color Portrait -->
      <img src="assets/girl-color.png" alt="Foreground Portrait" class="layer portrait-color" />

      <!-- Cursive "Happy" Text -->
      <div class="layer happy-text">Happy</div>

      <!-- Pink Bow -->
      <svg class="layer bow-icon" viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M55 45 C25 15, 5 35, 25 55 C38 65, 50 52, 55 48 Z" fill="#F48FB1" stroke="#AD1457" stroke-width="2"/>
        <path d="M52 46 C32 28, 18 38, 30 50" stroke="#FCE4EC" stroke-width="2" stroke-linecap="round"/>
        <path d="M65 45 C95 15, 115 35, 95 55 C82 65, 70 52, 65 48 Z" fill="#F48FB1" stroke="#AD1457" stroke-width="2"/>
        <path d="M68 46 C88 28, 102 38, 90 50" stroke="#FCE4EC" stroke-width="2" stroke-linecap="round"/>
        <path d="M54 52 L35 90 L48 85 L58 55 Z" fill="#F06292" stroke="#AD1457" stroke-width="2"/>
        <path d="M66 52 L85 90 L72 85 L62 55 Z" fill="#F06292" stroke="#AD1457" stroke-width="2"/>
        <rect x="52" y="38" width="16" height="16" rx="5" fill="#EC407A" stroke="#AD1457" stroke-width="2"/>
      </svg>

      <!-- Pink Hearts -->
      <div class="layer hearts-group">
        <svg class="heart h1" viewBox="0 0 32 32"><path fill="#FF80AB" stroke="#C2185B" stroke-width="1.5" d="M16 28.5C16 28.5 3 19.5 3 10.5C3 6.5 6.2 3.5 10 3.5C12.5 3.5 14.8 4.8 16 6.8C17.2 4.8 19.5 3.5 22 3.5C25.8 3.5 29 6.5 29 10.5C29 19.5 16 28.5 16 28.5Z"/></svg>
        <svg class="heart h2" viewBox="0 0 32 32"><path fill="#FF80AB" stroke="#C2185B" stroke-width="1.5" d="M16 28.5C16 28.5 3 19.5 3 10.5C3 6.5 6.2 3.5 10 3.5C12.5 3.5 14.8 4.8 16 6.8C17.2 4.8 19.5 3.5 22 3.5C25.8 3.5 29 6.5 29 10.5C29 19.5 16 28.5 16 28.5Z"/></svg>
        <svg class="heart h3" viewBox="0 0 32 32"><path fill="#FF80AB" stroke="#C2185B" stroke-width="1.5" d="M16 28.5C16 28.5 3 19.5 3 10.5C3 6.5 6.2 3.5 10 3.5C12.5 3.5 14.8 4.8 16 6.8C17.2 4.8 19.5 3.5 22 3.5C25.8 3.5 29 6.5 29 10.5C29 19.5 16 28.5 16 28.5Z"/></svg>
      </div>

      <!-- Monarch Butterfly -->
      <div class="layer butterfly-wrapper">
        <svg class="butterfly-svg" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
          <g class="wing-left">
            <path d="M58 50 C35 15, 5 20, 12 48 C16 62, 35 60, 56 54 Z" fill="#FF6D00" stroke="#1A1A1A" stroke-width="3"/>
            <path d="M56 54 C32 62, 18 78, 35 88 C48 94, 56 72, 58 58 Z" fill="#FF9100" stroke="#1A1A1A" stroke-width="3"/>
            <circle cx="18" cy="34" r="2" fill="#FFF"/>
            <circle cx="15" cy="42" r="1.8" fill="#FFF"/>
            <circle cx="28" cy="80" r="1.8" fill="#FFF"/>
          </g>
          <g class="wing-right">
            <path d="M62 50 C85 15, 115 20, 108 48 C104 62, 85 60, 64 54 Z" fill="#FF6D00" stroke="#1A1A1A" stroke-width="3"/>
            <path d="M64 54 C88 62, 102 78, 85 88 C72 94, 64 72, 62 58 Z" fill="#FF9100" stroke="#1A1A1A" stroke-width="3"/>
            <circle cx="102" cy="34" r="2" fill="#FFF"/>
            <circle cx="105" cy="42" r="1.8" fill="#FFF"/>
            <circle cx="92" cy="80" r="1.8" fill="#FFF"/>
          </g>
          <ellipse cx="60" cy="54" rx="3" ry="18" fill="#1A1A1A"/>
          <path d="M58 37 Q50 22 44 24" stroke="#1A1A1A" stroke-width="2" fill="none"/>
          <path d="M62 37 Q70 22 76 24" stroke="#1A1A1A" stroke-width="2" fill="none"/>
        </svg>
      </div>

      <button id="replayBtn" class="replay-btn" title="Replay Animation">↻ Replay</button>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
